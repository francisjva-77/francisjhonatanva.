<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ejemplo 03</title>
</head>
<body>
    <script>
        let anioNacimiento = Number(prompt("Ingrese su año de nacimiento:"));
        let anioActual = new Date().getFullYear();
        let edad = anioActual - anioNacimiento;

        document.write("Bienvenidos al curso de JAVASCRIPT<br>");
        document.write("-----------------------------------<br>");
        document.write("Su edad aproximada es: " + edad + " años<br>");
        document.write("-----------------------------------<br>");
    </script>
</body>
</html>
