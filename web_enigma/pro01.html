<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejemplo 01</title>
</head>
<body>
    <script>
        let precio = parseFloat(prompt("Ingrese el precio de la gaseosa:"));
        let cantidad = Number(prompt("Ingrese la cantidad de gaseosas:"));
        let total = precio * cantidad;

        document.write("Bienvenidos al curso de JAVASCRIPT<br>");
        document.write("-----------------------------------<br>");
        document.write("Monto total a pagar: S/ " + total.toFixed(2) + "<br>");
        document.write("-----------------------------------<br>");
    </script>
</body>
</html>
