<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ejemplo 04</title>
</head>
<body>
    <script>
        let nota1 = Number(prompt("Nota 1:"));
        let nota2 = Number(prompt("Nota 2:"));
        let nota3 = Number(prompt("Nota 3:"));
        let promedio = (nota1 + nota2 + nota3) / 3;

        document.write("Bienvenidos al curso de JAVASCRIPT<br>");
        document.write("-----------------------------------<br>");
        document.write("El promedio final es: " + promedio.toFixed(2) + "<br>");
        document.write("-----------------------------------<br>");
    </script>
</body>
</html>
