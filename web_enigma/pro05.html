<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ejemplo 05</title>
</head>
<body>
    <script>
        let precioOriginal = parseFloat(prompt("Precio del producto:"));
        let descuento = precioOriginal * 0.15;
        let precioFinal = precioOriginal - descuento;

        document.write("Bienvenidos al curso de JAVASCRIPT<br>");
        document.write("-----------------------------------<br>");
        document.write("Monto del descuento (15%): S/ " + descuento.toFixed(2) + "<br>");
        document.write("Precio final a pagar: S/ " + precioFinal.toFixed(2) + "<br>");
        document.write("-----------------------------------<br>");
    </script>
</body>
</html>
